specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MonstroHunt
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MonstroHunt
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Monster
        - Feed
        - Hunt
        - Sale
        - ProtocolStats
      abis:
        - name: MonstroHunt
          file: ./abis/MonstroHunt.json
      eventHandlers:
        - event: MonsterCreated(indexed uint256,indexed address,bytes32,uint8,uint8,uint256)
          handler: handleMonsterCreated
        - event: MonsterFed(indexed uint256,uint256,uint256,uint256)
          handler: handleMonsterFed
        - event: MonsterHunted(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleMonsterHunted
        - event: MonsterSold(indexed uint256,indexed address,uint256,uint256)
          handler: handleMonsterSold
      file: ./src/mapping.ts
